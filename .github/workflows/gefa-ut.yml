name: Gefa út

run-name: Gefa út ${{ inputs.version }} á npm (${{ inputs.npm_merki }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Útgáfan sem á að setja í package.json, t.d. 0.2.0-next.1
        required: true
        type: string
      npm_merki:
        description: npm-merki
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      dry_run:
        description: Keyra allt nema git-push og npm publish
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: gefa-ut-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  birta:
    name: Birta á npm
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setja inn forkröfur
        run: bun install --frozen-lockfile

      - name: Staðfesta útgáfubeiðni
        run: bun run ./skriftur/gefa-út.ts undirbúa "${{ inputs.version }}" "${{ inputs.npm_merki }}"

      - name: Sækja nýjasta Kristínarsnið
        run: bun run ./skriftur/sækja-kristínarsnið.ts .gögn --endursækja

      - name: Smíða og þjappa gagnaskrá
        run: bun run smíða:gagnaskrá --þjappa

      - name: Staðfesta fulla gagnaskrá
        env:
          BEYGIR_FULL_PARITY_CSV: .gögn/KRISTINsnid.csv
        run: bun test próf/samþætting/gagnaskrá-sha.test.ts

      - name: Keyra gæðapróf
        run: bun run kemba:skoða

      - name: Keyra Node.js reykpróf
        env:
          GAGNASKRA_SLOD: .gögn/beygir.bin
        run: bun run node:reykpróf

      - name: Smíða SQLite-gagnagrunn
        run: bun run ./dæmi/sqlite/smíða.ts .gögn/beygir.bin .gögn/beygir.sqlite --án-vísa --þjappa

      - name: Skrá útgáfuupplýsingar gagnaskrár
        run: |
          bun -e 'import { opnaBeygi } from "./kóði/beygir/gagnaskrá.ts"; using beygir = opnaBeygi({ slóð: ".gögn/beygir.bin" }); await Bun.write(".gögn/uppruni.json", `${JSON.stringify(beygir.staða().uppruni, null, 2)}\n`);'
          cat .gögn/uppruni.json
          cat .gögn/beygir.bin.sha256

      - name: Pakka útgáfugögnum
        run: |
          mkdir -p .gögn/útgáfa
          cp .gögn/beygir.bin .gögn/útgáfa/beygir.bin
          cp .gögn/beygir.bin.br .gögn/útgáfa/beygir.bin.br
          cp .gögn/beygir.bin.sha256 .gögn/útgáfa/beygir.bin.sha256
          cp .gögn/beygir.sqlite .gögn/útgáfa/beygir.sqlite
          cp .gögn/beygir.sqlite.br .gögn/útgáfa/beygir.sqlite.br
          cp .gögn/beygir.sqlite.sha256 .gögn/útgáfa/beygir.sqlite.sha256
          cp .gögn/uppruni.json .gögn/útgáfa/uppruni.json
          cp LICENSE .gögn/útgáfa/LICENSE
          cp NOTICE .gögn/útgáfa/NOTICE
          cp README.md .gögn/útgáfa/README.md
          cp GÖGN-OG-LEYFI.md .gögn/útgáfa/GÖGN-OG-LEYFI.md
          tar -czf ".gögn/beygir-gögn-${{ inputs.version }}.tar.gz" -C .gögn/útgáfa .

      - name: Skoða npm-pakka
        run: npm pack --dry-run

      - name: Festa útgáfu í git
        if: ${{ !inputs.dry_run }}
        run: bun run ./skriftur/gefa-út.ts festa "${{ inputs.version }}"

      - name: Skoða npm-birtingu
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --tag "${{ inputs.npm_merki }}" --access public

      - name: Birta á npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --tag "${{ inputs.npm_merki }}" --access public --provenance

      - name: Birta git-merki
        if: ${{ !inputs.dry_run }}
        run: bun run ./skriftur/gefa-út.ts birta-merki "${{ inputs.version }}"

      - name: Búa til GitHub-útgáfu
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${{ inputs.version }}" \
            --notes "Beygir ${{ inputs.version }}. npm-merki: ${{ inputs.npm_merki }}."

      - name: Birta gagnaskrár og leyfisskjöl
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            ".gögn/beygir-gögn-${{ inputs.version }}.tar.gz" \
            .gögn/beygir.bin \
            .gögn/beygir.bin.br \
            .gögn/beygir.bin.sha256 \
            .gögn/beygir.sqlite \
            .gögn/beygir.sqlite.br \
            .gögn/beygir.sqlite.sha256 \
            .gögn/uppruni.json \
            --repo "$GITHUB_REPOSITORY"
