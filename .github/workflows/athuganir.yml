name: Athuganir

on:
  push:
    branches: [stofn]
  pull_request:
    branches: [stofn]

permissions:
  contents: read

concurrency:
  group: athuganir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gaedi:
    name: Gæðaeftirlit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run smíða:skráarsnið:athuga
      - run: bun run oxfmt:athuga
      - run: bun run lint
      - run: bun run tsc
      - run: bun run dauður-kóði
      - run: bun run smíða:dreifingu
        if: github.event_name == 'push'
      - run: bun test
        if: github.event_name == 'push'

  samthaetting:
    name: Samþættingarpróf
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Búa til gagnamöppu
        run: mkdir -p .gögn
      - name: Sækja Kristínarsnið úr skyndiminni
        id: kristinarsnid-skyndiminni
        uses: actions/cache/restore@v5
        with:
          path: |
            .gögn/KRISTINsnid.csv.br
            .gögn/KRISTINsnid.csv.sha256sum
          key: ${{ runner.os }}-kristinarsnid-br-sha-
          restore-keys: ${{ runner.os }}-kristinarsnid-br-sha-
      - name: Sækja Kristínarsnið úr föstu gagnasafni
        if: steps.kristinarsnid-skyndiminni.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download gagnaskyndiminni \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            --pattern 'KRISTINsnid.csv.br' \
            --pattern 'KRISTINsnid.csv.sha256sum' \
            --dir .gögn; then
            echo "::warning::Fasta gagnasafnið fannst ekki; sæki KRISTINsnid.csv frá BÍN."
          fi
      - name: Undirbúa Kristínarsnið
        run: bun run sækja:gögn
      - name: Reikna skyndiminnislykil Kristínarsniðs
        id: kristinarsnid-lykill
        run: echo "key=${{ runner.os }}-kristinarsnid-br-sha-${{ hashFiles('.gögn/KRISTINsnid.csv.sha256sum') }}" >> "$GITHUB_OUTPUT"
      - name: Vista Kristínarsnið í skyndiminni
        if: steps.kristinarsnid-skyndiminni.outputs.cache-matched-key != steps.kristinarsnid-lykill.outputs.key
        uses: actions/cache/save@v5
        with:
          path: |
            .gögn/KRISTINsnid.csv.br
            .gögn/KRISTINsnid.csv.sha256sum
          key: ${{ steps.kristinarsnid-lykill.outputs.key }}
      - name: Smíða gagnaskrá
        run: bun run smíða:gagnaskrá
      - name: Staðfesta fulla gagnaskrá
        env:
          BEYGIR_HEILDARSAMRAEMI_KRISTINARSNID: .gögn/KRISTINsnid.csv
          BEYGIR_HEILDARSAMRAEMI_GAGNASKRA: .gögn/beygir.bin
        run: bun test próf/samþætting/gagnaskrá-sha.test.ts
      - name: Smíða Node.js dreifingu
        run: bun run smíða:dreifingu
      - name: Keyra próf
        run: bun test
      - name: Keyra Node.js reykpróf
        env:
          GAGNASKRA_SLOD: .gögn/beygir.bin
        run: bun run node:reykpróf

  pakkning:
    name: Pökkun
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Búa til gagnamöppu
        run: mkdir -p .gögn
      - name: Sækja Kristínarsnið úr skyndiminni
        id: kristinarsnid-skyndiminni
        uses: actions/cache/restore@v5
        with:
          path: |
            .gögn/KRISTINsnid.csv.br
            .gögn/KRISTINsnid.csv.sha256sum
          key: ${{ runner.os }}-kristinarsnid-br-sha-
          restore-keys: ${{ runner.os }}-kristinarsnid-br-sha-
      - name: Sækja Kristínarsnið úr föstu gagnasafni
        if: steps.kristinarsnid-skyndiminni.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download gagnaskyndiminni \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            --pattern 'KRISTINsnid.csv.br' \
            --pattern 'KRISTINsnid.csv.sha256sum' \
            --dir .gögn; then
            echo "::warning::Fasta gagnasafnið fannst ekki; sæki KRISTINsnid.csv frá BÍN."
          fi
      - name: Undirbúa Kristínarsnið
        run: bun run sækja:gögn
      - name: Smíða og þjappa gagnaskrá
        run: bun run smíða:gagnaskrá --þjappa
      - run: bun run smíða:dreifingu
      - run: bun run node:reykpróf
      - run: npm pack --dry-run
