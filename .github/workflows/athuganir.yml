name: Athuganir

on:
  push:
    branches: [stofn]
  pull_request:
    branches: [stofn]

permissions:
  contents: read

concurrency:
  group: athuganir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gaedi:
    name: Gæðaeftirlit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun kemba:skoða

  prof:
    name: Próf
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun próf

  samthaetting:
    name: Samþættingarpróf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Búa til gagnamöppu
        run: mkdir -p .gögn
      - name: Sækja Kristínarsnið úr skyndiminni
        id: kristinarsnid-skyndiminni
        uses: actions/cache/restore@v5
        with:
          path: |
            .gögn/KRISTINsnid.csv.br
            .gögn/KRISTINsnid.csv.sha256sum
          key: ${{ runner.os }}-kristinarsnid-br-sha-
          restore-keys: ${{ runner.os }}-kristinarsnid-br-sha-
      - name: Sækja Kristínarsnið úr föstu gagnasafni
        id: kristinarsnid-gagnasafn
        if: steps.kristinarsnid-skyndiminni.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download gagnaskyndiminni \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            --pattern 'KRISTINsnid.csv.br' \
            --pattern 'KRISTINsnid.csv.sha256sum' \
            --dir .gögn; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Fasta gagnasafnið fannst ekki; sæki KRISTINsnid.csv frá BÍN."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Smíða með skyndiminni
        run: |
          docker buildx bake --file compose.yml \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max' \
            --load
      - name: Undirbúa Kristínarsnið
        run: docker compose run --rm --user "$(id -u):$(id -g)" gagnasaekjari
      - name: Reikna skyndiminnislykil Kristínarsniðs
        id: kristinarsnid-lykill
        run: echo "key=${{ runner.os }}-kristinarsnid-br-sha-${{ hashFiles('.gögn/KRISTINsnid.csv.sha256sum') }}" >> "$GITHUB_OUTPUT"
      - name: Vista Kristínarsnið í skyndiminni
        if: steps.kristinarsnid-skyndiminni.outputs.cache-matched-key != steps.kristinarsnid-lykill.outputs.key
        uses: actions/cache/save@v5
        with:
          path: |
            .gögn/KRISTINsnid.csv.br
            .gögn/KRISTINsnid.csv.sha256sum
          key: ${{ steps.kristinarsnid-lykill.outputs.key }}
      - name: Sækja kjarna úr skyndiminni
        id: kjarni-skyndiminni
        uses: actions/cache@v5
        with:
          path: |
            .gögn/beygir.bin
            .gögn/beygir.bin.sha256
          key: ${{ runner.os }}-beygir-kjarni-${{ hashFiles('.gögn/KRISTINsnid.csv.sha256sum', 'kóði/**/*.ts', '!kóði/**/*.test.ts', 'skriftur/smíða-kjarna.ts', 'package.json', 'bun.lock', 'tsconfig.json') }}
      - name: Undirbúa kjarna
        if: steps.kjarni-skyndiminni.outputs.cache-hit != 'true'
        run: docker compose run --rm --no-deps --user "$(id -u):$(id -g)" kjarnasmidur
      - name: Keyra próf
        run: docker compose run --rm --no-deps yrda-beygir bun test
      - name: Smíða Node.js dreifingu
        run: docker compose run --rm --no-deps node-dreifingarsmidur
      - name: Keyra Node.js reykpróf
        run: docker compose run --rm --no-deps node-reykprof
