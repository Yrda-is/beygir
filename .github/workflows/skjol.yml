name: Skjöl

on:
  push:
    branches: [stofn]
  pull_request:
    branches: [stofn]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smida:
    name: Smíða skjöl
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - run: bun run skjöl
      - name: Hlaða upp GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: skjöl/forritaskil

  birta:
    name: Birta á GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/stofn'
    needs: smida
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Birta á GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
