name: Gefa út

run-name: Gefa út ${{ inputs.version }} á npm (${{ inputs.npm_merki }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Útgáfan sem á að setja í package.json, t.d. 0.1.0-next.1
        required: true
        type: string
      npm_merki:
        description: npm-merki
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      dry_run:
        description: Keyra allt nema git-push og npm publish
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: gefa-ut-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  birta:
    name: Birta á npm
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setja inn forkröfur
        run: bun install --frozen-lockfile

      - name: Staðfesta útgáfubeiðni
        run: bun run ./skriftur/gefa-út.ts undirbúa "${{ inputs.version }}" "${{ inputs.npm_merki }}"

      - name: Búa til gagnamöppu
        run: mkdir -p .gögn

      - name: Sækja Kristínarsnið úr skyndiminni
        id: kristinarsnid-skyndiminni
        uses: actions/cache/restore@v5
        with:
          path: |
            .gögn/KRISTINsnid.csv.br
            .gögn/KRISTINsnid.csv.sha256sum
          key: ${{ runner.os }}-kristinarsnid-br-sha-
          restore-keys: ${{ runner.os }}-kristinarsnid-br-sha-

      - name: Sækja Kristínarsnið úr föstu gagnasafni
        if: steps.kristinarsnid-skyndiminni.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download gagnaskyndiminni \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            --pattern 'KRISTINsnid.csv.br' \
            --pattern 'KRISTINsnid.csv.sha256sum' \
            --dir .gögn; then
            echo "::warning::Fasta gagnasafnið fannst ekki; sæki KRISTINsnid.csv frá BÍN."
          fi

      - name: Undirbúa Kristínarsnið
        run: bun run sækja:gögn

      - name: Keyra gæðapróf
        run: bun run kemba:skoða

      - name: Keyra próf
        run: bun test

      - name: Smíða og þjappa kjarna
        run: bun run smíða:kjarna:þjappa

      - name: Smíða skjöl
        run: bun run skjöl

      - name: Skoða npm-pakka
        run: npm pack --dry-run

      - name: Keyra Node.js reykpróf
        env:
          NODE_REYKPROF: "1"
          KJARNI_SLOD: .gögn/beygir.bin
        run: node próf/node-reykpróf.mjs

      - name: Festa útgáfu í git
        if: ${{ !inputs.dry_run }}
        run: bun run ./skriftur/gefa-út.ts festa "${{ inputs.version }}"

      - name: Skoða npm-birtingu
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --tag "${{ inputs.npm_merki }}" --access public

      - name: Birta á npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --tag "${{ inputs.npm_merki }}" --access public

      - name: Birta git-merki
        if: ${{ !inputs.dry_run }}
        run: bun run ./skriftur/gefa-út.ts birta-merki "${{ inputs.version }}"
