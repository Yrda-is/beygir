name: Gefa út SQLite

run-name: Gefa út SQLite ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Útgáfan sem á að bæta SQLite-gögnum við, t.d. 0.2.0-next.3
        required: true
        type: string
      dry_run:
        description: Keyra allt nema birta SQLite-gögn
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: gefa-ut-sqlite-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  birta:
    name: Birta SQLite-gagnagrunn
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setja inn forkröfur
        run: bun install --frozen-lockfile

      - name: Sækja útgefna gagnaskrá
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .gögn
          gh release download "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            --pattern 'beygir.bin' \
            --pattern 'beygir.bin.sha256' \
            --dir .gögn

      - name: Staðfesta útgefna gagnaskrá
        run: |
          cd .gögn
          sha256sum -c beygir.bin.sha256

      - name: Smíða SQLite-gagnagrunn
        run: bun run ./dæmi/sqlite/smíða.ts .gögn/beygir.bin .gögn/beygir.sqlite --án-vísa --þjappa

      - name: Skoða SQLite-gögn
        run: |
          ls -lh .gögn/beygir.sqlite .gögn/beygir.sqlite.br .gögn/beygir.sqlite.sha256
          cat .gögn/beygir.sqlite.sha256

      - name: Birta SQLite-gögn
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            .gögn/beygir.sqlite \
            .gögn/beygir.sqlite.br \
            .gögn/beygir.sqlite.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
